name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - name: Format
        run: |
          gofmt -l $(git ls-files '*.go' | grep -v '^vendor/') | tee /tmp/gofmt
          test ! -s /tmp/gofmt
      - run: go vet ./...
      - name: Package determinism & safe extraction tests
        run: go test -v -race -run 'TestPackageDeterminism|TestExtractRejects|TestSafeJoin' ./tests/unit/...
      - name: Resolver & constraint tests
        run: go test -v -race -run 'TestSelectVersion|TestConstraint' ./tests/unit/registry/...
      - name: Unit tests (race)
        run: go test -race -timeout 120s ./tests/unit/...
      - name: Integration tests (race)
        run: go test -race -timeout 180s -tags integration ./tests/integration/...
      - run: go build -trimpath -o dist/skpm ./cmd/skpm

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

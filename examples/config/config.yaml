# skpm configuration — place at ~/.config/skpm/config.yaml
# All token fields can be left empty and set via SKPM_REGISTRY_TOKEN instead.

# ── Pattern A: Skills in einem GitLab-Monorepo ────────────────────────────
#
# Alle Skills liegen als Releases in einem einzigen GitLab-Repo.
# Tag-Konvention: <skill-name>/v<version>
# Bsp: gitlab-policy-reviewer/v1.5.0
#
# skpm add gitlab-policy-reviewer@1.5.0 --source company-skills
# skpm add documentation-reviewer       --source company-skills

default_registry: company-skills

registries:
  company-skills:
    type: gitlab
    url: https://gitlab.company.com       # GitLab-Instanz-URL
    project: platform/agent-skills        # namespace/project des Monorepos
    token: ""                             # → SKPM_REGISTRY_TOKEN

---
# ── Pattern B: Jeder Skill in einem eigenen GitLab-Repo ──────────────────
#
# Skills haben separate Repos mit eigenem Lifecycle und eigenen Ownern.
# Tag-Konvention pro Repo: v<version>  (kein Skill-Name-Prefix nötig)
#
# skpm add gitlab-policy-reviewer@1.5.0 --source policy-skill
# skpm add documentation-reviewer@2.1.0 --source docs-skill
#
# Für skpm install spielt das Layout keine Rolle —
# die source_url im Lockfile enthält die direkte Download-URL.

default_registry: policy-skill

registries:
  policy-skill:
    type: gitlab
    url: https://gitlab.company.com
    project: platform-security/gitlab-policy-reviewer
    token: ""

  docs-skill:
    type: gitlab
    url: https://gitlab.company.com
    project: developer-experience/documentation-reviewer
    token: ""

  rf-skill:
    type: gitlab
    url: https://gitlab.company.com
    project: qa-platform/robotframework-reviewer
    token: ""

---
# ── Pattern C: Mix — eigene GitLab-Instanz + GitHub + Artifactory ─────────
#
# Unternehmens-Skills auf Self-Hosted GitLab, Open-Source-Skills via GitHub,
# gepackte Binaries via Artifactory.
#
# skpm add my-internal-skill --source internal-gitlab
# skpm add some-oss-skill    --source oss-github
# skpm add certified-skill   --source artifactory

default_registry: internal-gitlab

registries:
  internal-gitlab:
    type: gitlab
    url: https://gitlab.company.com
    project: platform/agent-skills
    token: ""                             # → SKPM_REGISTRY_TOKEN

  oss-github:
    type: github
    url: myorg/public-agent-skills        # owner/repo
    token: ""

  artifactory:
    type: artifactory
    url: https://artifactory.company.com/artifactory#agent-skills
    # url-Format: <base-url>#<repo-name>
    token: ""

  local-dev:
    type: local
    url: /home/user/agent-skills-local
    # Verzeichnisstruktur: <base>/<skill-name>/<version>/<skill-name>-<version>.zip

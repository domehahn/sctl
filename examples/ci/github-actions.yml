name: Agent Skills

on:
  push:
    paths:
      - agent-skills.lock
  pull_request:
    paths:
      - skills/**
      - agent-skills.lock
  push:
    tags:
      - '*/v*'   # e.g. gitlab-policy-reviewer/v1.5.0

env:
  SKPM_VERSION: "1.0.0"
  SKPM_CACHE_DIR: ~/.cache/skpm

jobs:
  # ── Install skills from lockfile ──────────────────────────────────────────

  install:
    name: Install skills
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Cache skpm artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/skpm
          key: sctl-${{ hashFiles('agent-skills.lock') }}
          restore-keys: sctl-

      - name: Install skpm
        run: |
          curl -sSL "https://github.com/domehahn/sctl/releases/download/v${SKPM_VERSION}/skm_${SKPM_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin skpm

      - name: Install skills
        run: skpm install --concurrency 4
        env:
          SKPM_REGISTRY_TOKEN: ${{ secrets.SKILLS_REGISTRY_TOKEN }}

  # ── Validate skills on pull requests ─────────────────────────────────────

  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install skpm
        run: |
          curl -sSL "https://github.com/domehahn/sctl/releases/download/v${SKPM_VERSION}/skm_${SKPM_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin skpm

      - name: Validate changed skills
        run: |
          EXIT=0
          for dir in skills/*/; do
            echo "::group::Validating $dir"
            if ! skpm validate "$dir"; then
              echo "::error::Validation failed for $dir"
              EXIT=1
            fi
            echo "::endgroup::"
          done
          exit $EXIT

  # ── Package and publish on tag ────────────────────────────────────────────

  release:
    name: Package and publish skill
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write   # for uploading release assets
    steps:
      - uses: actions/checkout@v4

      - name: Install skpm
        run: |
          curl -sSL "https://github.com/domehahn/sctl/releases/download/v${SKPM_VERSION}/skm_${SKPM_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin skpm

      - name: Derive skill name and version from tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "skill=${TAG%%/v*}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG##*/v}" >> "$GITHUB_OUTPUT"

      - name: Validate
        run: skpm validate "skills/${{ steps.tag.outputs.skill }}"

      - name: Package
        id: package
        run: |
          skpm package "skills/${{ steps.tag.outputs.skill }}" \
            --output-dir dist --output json | tee /tmp/pkg.json
          echo "sha256=$(jq -r '.data.sha256' /tmp/pkg.json)" >> "$GITHUB_OUTPUT"
          echo "path=$(jq -r '.data.path' /tmp/pkg.json)" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.path }}
          body: |
            SHA256: `${{ steps.package.outputs.sha256 }}`

            Add to your `agent-skills.lock`:
            ```yaml
            - name: ${{ steps.tag.outputs.skill }}
              version: ${{ steps.tag.outputs.version }}
              source: github
              source_url: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.tag.outputs.skill }}-${{ steps.tag.outputs.version }}.zip
              sha256: ${{ steps.package.outputs.sha256 }}
              installed_to:
                - .claude/skills/${{ steps.tag.outputs.skill }}
                - skills/${{ steps.tag.outputs.skill }}
            ```

version: 2

project_name: skpm

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: skpm
    main: ./cmd/skpm
    binary: skpm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/domehahn/skpm/v2/internal/cli.Version={{.Version}}
      - -X github.com/domehahn/skpm/v2/internal/cli.Commit={{.Commit}}
      - -X github.com/domehahn/skpm/v2/internal/cli.Date={{.Date}}

archives:
  - id: skpm
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
